<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Writing Process: Revising Before Editing</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Special+Elite&family=Oswald:wght@400;700&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --red: #C8102E;
      --navy: #0A1628;
      --gold: #F2A900;
      --cream: #F5E6C8;
      --steel: #6B7280;
      --dark: #0D0D0D;
    }

    * { box-sizing: border-box; }

    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2rem 1.25rem 3rem;
    }

    .hero {
      background: linear-gradient(135deg, var(--red), #8e0d22);
      border: 3px solid var(--gold);
      border-radius: 12px;
      padding: 2rem 2.2rem 1.8rem;
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
      margin-bottom: 1.3rem;
    }

    .hero .eyebrow {
      font-family: 'Courier Prime', monospace;
      font-size: 0.95rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.8);
      margin-bottom: 0.6rem;
    }

    .hero h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(2.6rem, 5.2vw, 3.6rem);
      letter-spacing: 3px;
      margin: 0 0 0.5rem;
      color: white;
    }

    body {
      margin: 0;
      font-family: 'Courier Prime', monospace;
      background: var(--navy);
      color: var(--cream);
      line-height: 1.7;
      background-image:
        repeating-linear-gradient(0deg, transparent, transparent 40px, rgba(255,255,255,0.015) 40px, rgba(255,255,255,0.015) 41px),
        repeating-linear-gradient(90deg, transparent, transparent 40px, rgba(255,255,255,0.015) 40px, rgba(255,255,255,0.015) 41px);
    }

    .hero p {
      margin: 0;
      color: rgba(255,255,255,0.95);
      font-size: 1.2rem;
    }

    .process-graphic {
      margin: 1.2rem auto 0;
      width: min(100%, 560px);
      aspect-ratio: 1 / 1;
      position: relative;
      background: rgba(255,255,255,0.06);
      border: 3px solid rgba(242,169,0,0.28);
      border-radius: 50%;
      overflow: hidden;
    }

    .process-graphic::before {
      content: '';
      position: absolute;
      inset: 8%;
      border: 3px solid rgba(242,169,0,0.15);
      border-radius: 50%;
    }

    .process-graphic .hub {
      position: absolute;
      inset: 35%;
      border-radius: 50%;
      background: var(--navy);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: var(--gold);
      font-family: 'Bebas Neue', sans-serif;
      letter-spacing: 1px;
      font-size: 1.3rem;
      padding: 0.8rem;
      box-shadow: 0 0 0 4px rgba(255,255,255,0.08);
    }

    .process-graphic .node {
      position: absolute;
      width: 104px;
      height: 104px;
      background: rgba(245,230,200,0.9);
      border: 2px solid rgba(242,169,0,0.35);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: var(--navy);
      font-family: 'Courier Prime', monospace;
      font-size: 0.8rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 0.8rem;
      line-height: 1.2;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.05);
    }

    .process-graphic .node.prewriting { top: 4%; left: 50%; transform: translateX(-50%); background: var(--red); color: white; border-color: rgba(255,255,255,0.25); }
    .process-graphic .node.drafting { top: 26%; right: 6%; background: var(--gold); color: var(--navy); }
    .process-graphic .node.revising { right: 4%; bottom: 22%; background: rgba(255,255,255,0.92); color: var(--navy); border-color: rgba(0,0,0,0.15); }
    .process-graphic .node.editing { left: 4%; bottom: 22%; background: rgba(10,22,40,0.9); color: var(--cream); border-color: rgba(242,169,0,0.3); }
    .process-graphic .node.publishing { top: 26%; left: 6%; background: rgba(245,230,200,0.88); color: var(--navy); border-color: rgba(242,169,0,0.25); }

    .process-graphic .node span {
      display: block;
      font-size: 0.8rem;
      font-weight: 700;
      line-height: 1.25;
    }

    .process-graphic .node.disabled {
      opacity: 0.55;
      filter: grayscale(0.8);
      cursor: not-allowed;
    }

    .process-graphic .node.active {
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .process-graphic .node.active:hover,
    .process-graphic .node.active:focus-visible {
      transform: scale(1.06);
      box-shadow: 0 0 0 4px rgba(242,169,0,0.4);
      outline: none;
    }

    .card {
      background: rgba(10, 22, 40, 0.95);
      border: 3px solid var(--gold);
      border-radius: 12px;
      padding: 1.6rem;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    }

    .progress {
      font-family: 'Courier Prime', monospace;
      font-size: 0.9rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 1rem;
    }

    .step-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.9rem;
      letter-spacing: 2px;
      color: var(--cream);
      margin-bottom: 0.7rem;
    }

    #stepContent p, #stepContent li {
      font-size: 1.25rem;
      color: rgba(245,230,200,0.95);
    }

    .callout {
      background: rgba(242, 169, 0, 0.15);
      border-left: 4px solid var(--gold);
      padding: 1rem 1.15rem;
      margin: 1.1rem 0;
      font-size: 1.14rem;
    }

    .sample {
      background: rgba(245,230,200,0.08);
      border: 1px solid rgba(245,230,200,0.18);
      border-radius: 8px;
      padding: 1.1rem 1.2rem;
      margin: 1.1rem 0;
      font-style: italic;
      font-size: 1.14rem;
    }

    .cover-intro {
      margin-bottom: 1.2rem;
    }

    .cover-intro h2 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.8rem;
      letter-spacing: 2px;
      color: var(--cream);
      margin: 0 0 0.45rem;
    }

    .cover-intro p {
      margin: 0;
      font-size: 1.05rem;
      color: rgba(245,230,200,0.9);
    }

    .choice-grid {
      display: grid;
      gap: 0.7rem;
      margin-top: 1rem;
    }

    .choice-btn {
      text-align: left;
      border: 2px solid var(--gold);
      background: rgba(242, 169, 0, 0.1);
      color: var(--cream);
      padding: 0.8rem 0.95rem;
      cursor: pointer;
      font-family: 'Special Elite', cursive;
      border-radius: 8px;
      font-size: 1.05rem;
    }

    .choice-btn:hover {
      background: rgba(242, 169, 0, 0.2);
    }

    .feedback {
      margin-top: 0.8rem;
      padding: 0.8rem 0.95rem;
      border-radius: 8px;
      display: none;
      background: rgba(200, 16, 46, 0.16);
      border: 1px solid rgba(200,16,46,0.25);
    }

    .feedback.show { display: block; }

    .nav {
      display: flex;
      justify-content: space-between;
      gap: 0.8rem;
      margin-top: 1.2rem;
      flex-wrap: wrap;
    }

    .nav button,
    .nav a {
      border: 1px solid rgba(242, 169, 0, 0.35);
      padding: 0.35rem 0.7rem;
      font-family: 'Oswald', sans-serif;
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      background: transparent;
      color: var(--gold);
      border-radius: 999px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      line-height: 1.2;
    }

    .nav button:hover,
    .nav a:hover {
      background: rgba(242, 169, 0, 0.12);
      color: var(--cream);
    }

    .nav button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .checklist {
      padding-left: 1rem;
    }

    .checklist li {
      margin-bottom: 0.5rem;
    }

    .reference-list {
      list-style: none;
      padding-left: 0;
      margin: 1rem 0;
    }

    .reference-list li {
      padding-left: 2rem;
      text-indent: -2rem;
      margin-bottom: 0.9rem;
      font-size: 1.05rem;
    }

    .tiny {
      font-family: 'Courier Prime', monospace;
      font-size: 0.8rem;
      letter-spacing: 1px;
      color: var(--gold);
      text-transform: uppercase;
      margin-top: 0.9rem;
    }

    @media (max-width: 700px) {
      .wrap { padding: 1rem 0.75rem 2rem; }
      .card { padding: 1rem; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <div class="eyebrow" id="heroEyebrow">Writing Process Tool</div>
      <h1 id="heroTitle">Writing Process</h1>
      <p id="heroSubtitle">This pathway helps students understand how writing moves through planning, drafting, revising, editing, and publishing.</p>
      <div class="process-graphic" id="processGraphic" aria-label="Recursive writing process loop">
        <div class="hub">The Writing Process</div>
        <div class="node prewriting disabled" title="Coming soon"><span>Prewriting</span></div>
        <div class="node drafting disabled" title="Coming soon"><span>Drafting</span></div>
        <div class="node revising active" id="openRevising" role="button" tabindex="0" title="Open Revising"><span>Revising</span></div>
        <div class="node editing disabled" title="Coming soon"><span>Editing</span></div>
        <div class="node publishing disabled" title="Coming soon"><span>Publishing</span></div>
      </div>
    </header>

    <main class="card">
      <div class="progress" id="progress">Writing Process Overview</div>
      <div id="stepContent"></div>
      <div class="nav" id="navBar">
        <button id="prevBtn">← Back</button>
        <div style="display:flex; gap:0.6rem; flex-wrap:wrap;">
          <button id="restartBtn">Restart</button>
          <a href="../../index.html">Home</a>
        </div>
        <button id="nextBtn">Continue →</button>
      </div>
    </main>
  </div>

  <script>
    const steps = [
      {
        title: 'Stop 1 of 8 — Why Revision Comes First',
        subtitle: '“The only kind of writing is rewriting.” (Hemingway, as cited in Plimpton, 1958)',
        html: `
          <div class="step-title">Revision is the first job of a strong writer.</div>
          <p>Before a writer fixes commas or spelling, they need to ask whether the draft actually says what it means to say. Revision focuses on purpose, clarity, organization, support, and overall effectiveness.</p>
          <div class="callout">
            <strong>Revision</strong> asks: What needs to be clearer, stronger, cut, or reorganized?
          </div>
          <p>Editing comes later. It helps with spelling, punctuation, capitalization, and formatting. A paper can still be weak even if every error is corrected.</p>
        `
      },
      {
        title: 'Stop 2 of 8 — Start With Meaning',
        subtitle: '“Writing is a process of using language to discover meaning in experience and to communicate it.” (Murray, 1972)',
        html: `
          <div class="step-title">Good revision begins with the writer’s purpose.</div>
          <p>When a writer revises, the goal is not to polish every sentence right away. The goal is to improve the draft as a whole by asking whether the paper actually says what it wants to say.</p>
          <div class="callout">
            If the claim is confusing, the evidence is thin, or the organization falls apart, fixing surface errors will not solve the real issue.
          </div>
          <p>Good revision asks: What needs to be clearer? What needs more support? What should be cut, moved, or explained more fully?</p>
        `
      },
      {
        title: 'Stop 3 of 8 — What to Look For in Revision',
        subtitle: '“Rewriting is the essence of writing well: it’s where the game is won or lost.” (Zinsser, 2006)',
        html: `
          <div class="step-title">When you revise, look for the big issues first.</div>
          <div class="callout">
            <strong>High-order concerns:</strong> purpose, clarity, focus, organization, and support.
          </div>
          <p>Ask: What is the writer really trying to say? Does the draft stay on that point? Where does the reader get confused, lose the thread, or want more explanation?</p>
          <div class="callout">
            <strong>Lower-order concerns:</strong> spelling, punctuation, capitalization, and formatting. These matter, but they come later.
          </div>
          <p>Revision is about improving the draft as a whole. Editing is about polishing what remains after the meaning is stronger.</p>
        `
      },
      {
        title: 'Stop 4 of 8 — Practice With a Real Draft',
        subtitle: '“Almost all good writing begins with terrible first efforts. You need to start somewhere.” (Lamott, 1994)',
        html: `
          <div class="step-title">Here is a sample draft with revision needs.</div>
          <div class="sample">
            “The field of text and technology is an amalgamation of varying fields which, much like Voltron, come together to form a dynamic interdisciplinary field. It brings together writing, media, and code in a way that is really important to students. The idea is that the subject is complex and changing, and that makes it interesting.”
          </div>
          <p>Which move would make this draft stronger?</p>
          <div class="choice-grid">
            <button class="choice-btn" data-feedback="Yes. This choice targets the real problem: the draft needs clearer focus and a more direct explanation of the idea.">Clarify the main point by cutting repetition and making the claim more specific.</button>
            <button class="choice-btn" data-feedback="That may help later, but it does not solve the larger issue. The draft still needs stronger structure and clearer explanation.">Fix the spelling and punctuation first.</button>
            <button class="choice-btn" data-feedback="That may sound more polished, but it does not improve the underlying meaning or organization.">Swap in more impressive vocabulary.</button>
          </div>
          <div class="feedback" id="feedback"></div>
        `
      },
      {
        title: 'Stop 5 of 8 — Editing Practice With the Voltron Challenge',
        subtitle: '“Kill your darlings, kill your darlings, even when it breaks your egocentric little scribbler’s heart, kill your darlings.” (King, 2000)',
        html: `
          <div class="step-title">Now let students distinguish editing from revision.</div>
          <div class="sample">
            “The field of Text and technology is an amalgamtion of varying fields which, much like Voltron, come togeter to form a dynamic interdiscplinary field. It blnds writing, media, and code into one area of study.”
          </div>
          <p>Which of these belongs in editing?</p>
          <div class="choice-grid">
            <button class="choice-btn" data-feedback="Yes. These are surface-level correctness issues, and they belong in editing. The sentence may still need revision after the errors are corrected.">Correct typos and punctuation issues like “amalgamtion,” “togeter,” and “interdiscplinary.”</button>
            <button class="choice-btn" data-feedback="That is too broad. The sentence may still need revision after the errors are corrected, but the errors themselves are editing concerns.">Rewrite the entire sentence because it is not clear enough.</button>
            <button class="choice-btn" data-feedback="That ignores the visible errors. Editing is still part of the job, even when the draft also needs revision.">Leave the mistakes alone and focus only on the big idea.</button>
          </div>
          <div class="feedback" id="feedback"></div>
        `
      },
      {
        title: 'Stop 6 of 8 — What Strong Revision Looks Like',
        subtitle: '“Clutter is the disease of American writing.” (Zinsser, 2006)',
        html: `
          <div class="step-title">Revision makes a draft more effective.</div>
          <p>A strong revision can do any of these things:</p>
          <ul>
            <li>make the main claim easier to find</li>
            <li>improve the flow from one paragraph to the next</li>
            <li>add evidence or explanation where the draft feels thin</li>
            <li>cut repetition, filler, or wandering ideas</li>
          </ul>
          <div class="callout">
            Revision changes the draft at the level of meaning, structure, and purpose. Editing polishes the draft after that work is done.
          </div>
        `
      },
      {
        title: 'Stop 7 of 8 — A Revision Checklist',
        subtitle: '“Omit needless words.” (Strunk & White, 2000)',
        html: `
          <div class="step-title">Before you edit anything, ask these questions.</div>
          <ul class="checklist">
            <li>What is the main idea I am trying to communicate?</li>
            <li>Where does the draft feel confusing, weak, or repetitive?</li>
            <li>What should I add, cut, or move?</li>
            <li>Do I need more evidence, explanation, or a clearer transition?</li>
            <li>What small errors remain after the meaning is stronger?</li>
            <li>Am I revising for clarity first, then polishing for correctness?</li>
          </ul>
          <div class="callout">
            <strong>Rule of thumb:</strong> revise first, edit second, and ask questions before you start changing words.
          </div>
          <div class="tiny">This completes the current Revising section. More Writing Process tools will be added later.</div>
        `
      },
      {
        title: 'Stop 8 of 8 — References',
        subtitle: 'Works cited in this walkthrough, in APA 7th edition style.',
        html: `
          <div class="step-title">References</div>
          <ul class="reference-list">
            <li>King, S. (2000). <em>On writing: A memoir of the craft</em>. Scribner.</li>
            <li>Lamott, A. (1994). <em>Bird by bird: Some instructions on writing and life</em>. Anchor Books.</li>
            <li>Murray, D. M. (1972). Teach writing as a process, not product. <em>The Leaflet, 71</em>(3), 11–14.</li>
            <li>Plimpton, G. (1958). Ernest Hemingway, the art of fiction no. 21. <em>The Paris Review</em>, (18).</li>
            <li>Strunk, W., Jr., &amp; White, E. B. (2000). <em>The elements of style</em> (4th ed.). Allyn and Bacon.</li>
            <li>Zinsser, W. (2006). <em>On writing well: The classic guide to writing nonfiction</em> (30th anniversary ed.). HarperCollins.</li>
          </ul>
          <div class="tiny">Verify page numbers against your specific edition before citing in student-facing materials.</div>
        `
      }
    ];

    const stepContent = document.getElementById('stepContent');
    const progress = document.getElementById('progress');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const restartBtn = document.getElementById('restartBtn');
    const navBar = document.getElementById('navBar');
    const processGraphic = document.getElementById('processGraphic');
    const heroEyebrow = document.getElementById('heroEyebrow');
    const heroTitle = document.getElementById('heroTitle');
    const heroSubtitle = document.getElementById('heroSubtitle');
    const params = new URLSearchParams(window.location.search);
    const startInRevising = params.get('view') === 'revising';
    let currentStep = startInRevising ? 0 : -1;

    function renderStep() {
      if (currentStep < 0) {
        processGraphic.style.display = '';
        heroEyebrow.textContent = 'Writing Process Tool';
        heroTitle.textContent = 'Writing Process';
        heroSubtitle.textContent = 'This pathway helps students understand how writing moves through planning, drafting, revising, editing, and publishing.';
        stepContent.innerHTML = `
          <div class="cover-intro">
            <h2>Writing Process</h2>
            <p>Choose a stage from the graphic above to begin. Revising is ready now, and the other stages are coming soon.</p>
          </div>
        `;
        progress.textContent = 'Writing Process Overview';
        navBar.style.display = 'flex';
        prevBtn.style.display = 'none';
        restartBtn.style.display = 'none';
        nextBtn.style.display = 'none';
        return;
      }

      processGraphic.style.display = 'none';
      const [, stepHeadline] = steps[currentStep].title.split(' — ');
      heroEyebrow.textContent = 'Writing Process Tool — Revising';
      heroTitle.textContent = stepHeadline;
      heroSubtitle.textContent = steps[currentStep].subtitle || '';
      stepContent.innerHTML = steps[currentStep].html;
      progress.textContent = 'Revising';
      prevBtn.style.display = 'inline-flex';
      restartBtn.style.display = 'inline-flex';
      nextBtn.style.display = 'inline-flex';
      prevBtn.disabled = currentStep === 0;
      nextBtn.textContent = currentStep === steps.length - 1 ? 'Finished' : 'Continue →';
      window.scrollTo(0, 0);

      document.querySelectorAll('.choice-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const target = btn.parentElement.nextElementSibling;
          if (target && target.classList.contains('feedback')) {
            target.textContent = btn.dataset.feedback;
            target.classList.add('show');
          }
        });
      });
    }

    prevBtn.addEventListener('click', () => {
      if (currentStep > 0) {
        currentStep -= 1;
        renderStep();
      }
    });

    nextBtn.addEventListener('click', () => {
      if (currentStep < 0) {
        currentStep = 0;
        renderStep();
      } else if (currentStep < steps.length - 1) {
        currentStep += 1;
        renderStep();
      }
    });

    restartBtn.addEventListener('click', () => {
      currentStep = -1;
      renderStep();
    });

    document.addEventListener('click', (event) => {
      if (event.target.closest('#openRevising')) {
        currentStep = 0;
        renderStep();
      }
    });

    document.addEventListener('keydown', (event) => {
      if ((event.key === 'Enter' || event.key === ' ') && event.target.id === 'openRevising') {
        event.preventDefault();
        currentStep = 0;
        renderStep();
      }
    });

    renderStep();
  </script>
</body>
</html>
