<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teaching Demonstration — Twine Tools for Teaching</title>
  <style>
    :root {
      --red: #C8102E;
      --navy: #0A1628;
      --gold: #F2A900;
      --cream: #F5E6C8;
      --steel: #6B7280;
      --dark: #0D0D0D;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Georgia, serif;
      background: var(--navy);
      color: var(--cream);
      line-height: 1.6;
    }
    .wrap { max-width: 900px; margin: 0 auto; padding: 2rem; }
    .card {
      background: var(--cream);
      color: var(--dark);
      border: 4px solid var(--dark);
      box-shadow: 8px 8px 0 var(--dark);
      padding: 2rem;
      border-top: 8px solid var(--red);
    }
    h1 { font-size: clamp(2rem, 4vw, 3rem); margin: 0 0 0.75rem; color: var(--red); }
    p { font-size: 1rem; }
    .actions { margin-top: 1.5rem; }
    .btn {
      display: inline-block;
      background: var(--red);
      color: white;
      text-decoration: none;
      padding: 0.8rem 1.1rem;
      font-weight: bold;
      margin-right: 0.8rem;
      margin-bottom: 0.8rem;
    }
    .btn.secondary { background: var(--navy); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Teaching Demonstration</h1>
      <p>This page serves as the entry point for the Teaching Demonstration within Twine Tools for Teaching.</p>
      <p>Open the full slide presentation to view the lecture-style demonstration, or return to the broader teaching resources.</p>
      <div class="actions">
        <a class="btn" href="teaching-demonstration.html">Open the presentation</a>
        <a class="btn secondary" href="additional-resources.html">View additional resources</a>
      </div>
    </div>
  </div>
</body>
</html>
